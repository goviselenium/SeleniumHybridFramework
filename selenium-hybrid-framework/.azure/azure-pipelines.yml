# ============================================================
# azure-pipelines.yml
# Selenium Hybrid Framework - Azure DevOps CI/CD Pipeline
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md

pr:
  branches:
    include:
      - main

# ============================================================
# Pipeline Variables
# Set secret variables (PAT, passwords) in Azure DevOps Library
# ============================================================
variables:
  - group: selenium-framework-secrets      # Variable Group in Azure DevOps Library
  - name: MAVEN_CACHE_FOLDER
    value: $(Pipeline.Workspace)/.m2/repository
  - name: BROWSER
    value: chrome
  - name: ENV
    value: qa
  - name: AZURE_TEST_PLAN_ID
    value: "1"                              # Replace with your Test Plan ID
  - name: AZURE_TEST_RUN_NAME
    value: "Automated Run - $(Build.BuildNumber)"

# ============================================================
# Stages
# ============================================================
stages:

  # ----------------------------------------------------------
  # Stage 1: Build & Test
  # ----------------------------------------------------------
  - stage: BuildAndTest
    displayName: "Build & Run Selenium Tests"
    jobs:
      - job: SeleniumTests
        displayName: "Selenium Test Execution"
        pool:
          vmImage: "ubuntu-latest"

        steps:

          # 1. Checkout source code
          - checkout: self
            displayName: "Checkout Repository"

          # 2. Setup Java 11
          - task: JavaToolInstaller@0
            displayName: "Setup Java 11"
            inputs:
              versionSpec: "11"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          # 3. Cache Maven dependencies
          - task: Cache@2
            displayName: "Cache Maven Dependencies"
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(MAVEN_CACHE_FOLDER)

          # 4. Install Google Chrome
          - script: |
              wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
              echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | \
                sudo tee /etc/apt/sources.list.d/google-chrome.list
              sudo apt-get update
              sudo apt-get install -y google-chrome-stable
              google-chrome --version
            displayName: "Install Google Chrome"

          # 5. Run Maven Tests
          - task: Maven@3
            displayName: "Run Selenium Tests"
            inputs:
              mavenPomFile: "pom.xml"
              goals: "clean test"
              options: >
                -Dbrowser=$(BROWSER)
                -Denv=$(ENV)
                -Dheadless=true
                -DazureOrgUrl=$(AZURE_ORG_URL)
                -DazurePat=$(AZURE_PAT)
                -DazureProjectName=$(AZURE_PROJECT_NAME)
                -DazureTestPlanId=$(AZURE_TEST_PLAN_ID)
                -DazureTestRunName="$(AZURE_TEST_RUN_NAME)"
                -Dazure.update.enabled=true
                -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)
              publishJUnitResults: true
              testResultsFiles: "**/reports/cucumber-junit.xml"
              testRunTitle: "$(AZURE_TEST_RUN_NAME)"
              javaHomeOption: "JDKVersion"
              jdkVersionOption: "1.11"
            continueOnError: true            # Don't fail pipeline on test failures

          # 6. Publish Extent HTML Report
          - task: PublishHtmlReport@1
            displayName: "Publish Extent HTML Report"
            inputs:
              reportDir: "reports"
              tabName: "Selenium Report"
            condition: always()

          # 7. Publish Cucumber JSON Report
          - task: PublishBuildArtifacts@1
            displayName: "Publish Test Reports Artifact"
            inputs:
              PathtoPublish: "reports"
              ArtifactName: "TestReports"
              publishLocation: "Container"
            condition: always()

          # 8. Publish Screenshots on Failure
          - task: PublishBuildArtifacts@1
            displayName: "Publish Screenshots"
            inputs:
              PathtoPublish: "reports/screenshots"
              ArtifactName: "Screenshots"
              publishLocation: "Container"
            condition: always()

  # ----------------------------------------------------------
  # Stage 2: Notify (optional - sends Teams/Email notification)
  # ----------------------------------------------------------
  - stage: Notify
    displayName: "Send Notifications"
    dependsOn: BuildAndTest
    condition: always()
    jobs:
      - job: SendNotification
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - script: |
              echo "Pipeline Status: $(Agent.JobStatus)"
              echo "Build Number: $(Build.BuildNumber)"
              echo "Test results have been updated in Azure DevOps Test Plans."
            displayName: "Print Summary"
