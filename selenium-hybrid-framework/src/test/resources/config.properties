# =========================================
# Framework Configuration
# =========================================

# Browser: chrome | firefox | edge
browser=chrome
headless=false

# Environment: qa | staging | prod
env=qa
base.url=https://your-app-url.com

# Implicit Wait (seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Screenshot on Failure
screenshot.on.failure=true
screenshot.path=reports/screenshots/

# Extent Report
report.path=reports/ExtentReport.html
report.name=Selenium Hybrid Framework Report
report.title=Test Execution Report

# =========================================
# Azure DevOps Configuration
# =========================================
# Organization URL: https://dev.azure.com/your-org
azure.org.url=https://dev.azure.com/YOUR_ORG
azure.project.name=YOUR_PROJECT
azure.pat=YOUR_PERSONAL_ACCESS_TOKEN

# Test Plan ID (from Azure DevOps Test Plans)
azure.test.plan.id=1
azure.test.run.name=Automated Test Run

# Update Azure on execution: true | false
azure.update.enabled=true

# Result Outcome mapping
# Maps TestNG status to Azure DevOps outcome
# Azure outcomes: Passed | Failed | Blocked | NotExecuted | Inconclusive
azure.outcome.passed=Passed
azure.outcome.failed=Failed
azure.outcome.skipped=NotExecuted
